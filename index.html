<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahantesh & Sahana - Wedding Invitation</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Soft cream pastel background with a subtle paper texture */
            background-color: #fcf9f2; 
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            font-family: 'Playfair Display', serif;
            color: #5c4a44;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: transparent;
            min-height: 100vh;
            position: relative;
        }

        /* WATERCOLOR FLORALS & LEAVES */
        .floral-top {
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 250px;
            object-fit: cover;
            opacity: 0.6;
            mix-blend-mode: multiply; /* This makes the background vanish like real paint! */
            pointer-events: none;
            z-index: 1;
        }

        .banana-leaves {
            position: absolute;
            bottom: -50px;
            right: -30px;
            width: 250px;
            height: 350px;
            object-fit: cover;
            opacity: 0.5;
            mix-blend-mode: multiply;
            pointer-events: none;
            border-radius: 50%;
            z-index: 1;
        }

        /* The Arched Mandap Frame */
        .arch-frame {
            margin: 30px 20px;
            border: 1.5px solid #d4c1b3;
            border-top-left-radius: 200px;
            border-top-right-radius: 200px;
            padding: 50px 20px 40px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(254,250,245,0.95));
            box-shadow: inset 0 0 20px rgba(212, 193, 179, 0.2), 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
            z-index: 2;
        }

        .ganesha {
            width: 45px;
            margin-bottom: 20px;
            opacity: 0.75;
        }

        .intro {
            font-size: 14px;
            color: #8c766e;
            margin-bottom: 25px;
            font-style: italic;
        }

        /* Deep Maroon Cursive Names */
        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 58px;
            color: #8b2b2f; 
            line-height: 1.1;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(139, 43, 47, 0.1);
        }

        .and {
            font-size: 28px;
            color: #b08d6a; 
            display: block;
            margin: 5px 0;
        }

        /* The elegant Date format */
        .date-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            font-size: 15px;
            color: #5c4a44;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .line {
            width: 40px;
            height: 1px;
            background-color: #d4c1b3;
        }

        .main-date {
            font-size: 28px;
            color: #8b2b2f;
            font-weight: 600;
        }

        /* CARTOON COUPLE IMAGE */
        .cartoon-couple {
            width: 180px;
            margin: 30px auto 20px;
            display: block;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.1));
        }

        /* Venue Details */
        .venue {
            font-size: 14px;
            margin-top: 20px;
            color: #5c4a44;
            line-height: 1.8;
            padding: 15px;
            border-top: 1px dashed #d4c1b3;
            border-bottom: 1px dashed #d4c1b3;
        }

        /* Soft Pastel Buttons */
        .btn-pastel {
            text-decoration: none; color: #fff; background-color: #8b2b2f; 
            padding: 14px; border-radius: 30px; display: block; font-size: 14px;
            margin: 12px auto; max-width: 250px; letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(139, 43, 47, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <img src="https://images.unsplash.com/photo-1578306915234-8c8182f059a6?q=80&w=600&auto=format&fit=crop" class="floral-top" alt="floral">
        <img src="https://images.unsplash.com/photo-1550989460-0adf9ea622e2?q=80&w=600&auto=format&fit=crop" class="banana-leaves" alt="leaves">

        <div class="arch-frame">
            
            <img src="https://cdn-icons-png.flaticon.com/512/8200/8200380.png" class="ganesha" alt="Ganesha">
            
            <p class="intro">Together with our families, we cordially invite you to the wedding of</p>
            
            <div class="names">
                Mahantesh
                <span class="and">and</span>
                Sahana
            </div>
            
            <div class="date-divider">
                <span>May</span>
                <div class="line"></div>
                <span class="main-date">10<sup style="font-size: 14px;">TH</sup></span>
                <div class="line"></div>
                <span>2026</span>
            </div>

            <img src="https://cdn-icons-png.flaticon.com/512/4145/4145322.png" class="cartoon-couple" alt="Cartoon Couple">

            <div class="venue">
                <strong>Sri Amma Maheshwari Garden Hall</strong><br>
                Navali Road, Behind Canara Bank<br>
                Karatagi
            </div>

            <div style="margin-top: 35px;">
                <p style="font-size: 12px; color: #8c766e; margin-bottom: 15px; font-style: italic;">RSVP to Vakkaligera Family</p>
                <a href="tel:+91953853585" class="btn-pastel">📞 Call to RSVP</a>
                <a href="https://wa.me/91740491542" style="background-color: #638861;" class="btn-pastel">💬 WhatsApp Us</a>
            </div>

        </div>
    </div>

</body>
</html>
